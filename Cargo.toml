[workspace]
members = ["crates/rlt-core", "crates/rlt-cli"]
resolver = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0

[workspace.dependencies]
# Arrow ecosystem
arrow = { version = "55", features = ["json"] }
arrow-json = "55"
parquet = { version = "55", features = ["async", "zstd", "snap"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cloud storage
object_store = { version = "0.12", features = ["gcp"] }

# CLI & HTTP
clap = { version = "4", features = ["derive"] }
axum = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indexmap = "2"
tokio-stream = "0.1"
