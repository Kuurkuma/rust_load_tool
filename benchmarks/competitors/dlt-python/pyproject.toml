[project]
name = "dlt-ingest-service"
version = "0.1.0"
description = "dlt Python ingestion microservice for Cloud Run benchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "dlt[gcp]>=0.4.10",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
